<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Browse NetKit PNG icons for apps, regions, and proxy groups, and copy their GitHub Raw URLs.">
  <title>NetKit Icons</title>
  <script>
    try {
      if (localStorage.getItem('netkit-theme') === 'light') {
        document.documentElement.dataset.theme = 'light';
      }
    } catch {
      // Storage can be unavailable in some browsers.
    }
  </script>
  <link rel="stylesheet" href="./style.css?v=8">
  <script src="./app.js?v=7" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="./">
        <span class="brand-mark" aria-hidden="true"></span>
        NetKit
      </a>
      <div class="header-actions">
        <button type="button" id="theme-toggle" class="theme-toggle" hidden>
          <span class="theme-symbol" aria-hidden="true"></span>
          <span class="theme-label"></span>
        </button>
        <a class="repository" href="https://github.com/jennieveloramae/NetKit">GitHub</a>
      </div>
    </div>
  </header>

  <main class="shell">
    <section class="intro" aria-labelledby="title">
      <h1 id="title">Jennie’s Icons</h1>
      <p>PNG icons for apps, regions, and proxy groups.</p>
      <p class="star-note">Love NetKit? 💜 Give it a <strong><a href="https://github.com/jennieveloramae/NetKit">star on GitHub</a></strong> ⭐ Thanks!</p>
      <label class="search">
        <span class="visually-hidden">Search icons</span>
        <span class="search-mark" aria-hidden="true"></span>
        <input id="search" type="search" placeholder="Search icons…" autocomplete="off" spellcheck="false">
      </label>
      <section id="icon-subscription" class="icon-subscription" aria-labelledby="icon-subscription-title">
        <h2 id="icon-subscription-title">Icon subscription <small style="margin-inline-start:.35rem;font-size:.8em;font-weight:400;color:var(--muted)">Click an icon to import or copy the link.</small></h2>
        <div class="subscription-actions">
          <a class="subscription-control" data-icon-app="quantumult" title="One-click import" aria-label="Import icon set into Quantumult X" hidden><img src="./icon/apps/QuantumultX.png" alt="" width="24" height="24"></a>
          <a class="subscription-control" data-icon-app="loon" title="One-click import" aria-label="Import icon set into Loon" hidden><img src="./icon/apps/Loon.png" alt="" width="24" height="24"></a>
          <a class="subscription-control" data-icon-app="stash" title="One-click import" aria-label="Import icon set into Stash" hidden><img src="./icon/apps/Stash.png" alt="" width="24" height="24"></a>
          <button type="button" id="copy-icon-set" class="subscription-control" title="Copy the icon set URL" aria-label="Copy shared icon set URL for Surge, Egern, and FlClash" hidden>
            <img src="./icon/apps/Surge.png" alt="" width="24" height="24">
            <img class="subscription-icon-egern" src="./icon/apps/Egern.png" alt="" width="32" height="32">
            <img src="./icon/apps/FlClash.png" alt="" width="24" height="24">
          </button>
          <a class="subscription-control" href="#gallery" title="Copy an individual icon URL below for your configuration or a compatible client." aria-label="Mihomo and sing-box: browse individual icons to copy a URL for your configuration or a compatible client.">
            <img src="./icon/apps/Mihomo.png" alt="" width="24" height="24">
            <img src="./icon/apps/sing-box.png" alt="" width="24" height="24">
          </a>
        </div>
        <p id="subscription-copy-status" role="status"></p>
      </section>
    </section>

    <div class="gallery-controls">
      <div class="filters" role="group" aria-label="Filter by category">
        <button type="button" data-category="all" aria-pressed="true">All <span></span></button>
        <button type="button" data-category="apps" aria-pressed="false">Apps <span></span></button>
        <button type="button" data-category="groups" aria-pressed="false">Groups <span></span></button>
        <button type="button" data-category="flags" aria-pressed="false">Flags <span></span></button>
      </div>
      <p id="results" role="status">Loading icons…</p>
    </div>

    <ul class="gallery" id="gallery" tabindex="-1" aria-label="Icons" role="list"></ul>
    <noscript>Enable JavaScript to browse and search the icon collection.</noscript>
  </main>

  <p id="copy-status" class="visually-hidden" role="status"></p>
  <dialog id="copy-dialog" aria-labelledby="copy-title">
    <form method="dialog">
      <h2 id="copy-title">Copy URL</h2>
      <p>Select and copy the link below.</p>
      <input id="manual-url" type="text" aria-label="URL to copy" readonly autofocus>
      <button type="submit">Done</button>
    </form>
  </dialog>
</body>
</html>
